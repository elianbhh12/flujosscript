[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aid-pipeline"
version = "1.0.0"
description = "Pipeline de descarga y validacion Dynamo config-control / text-analyzer"
requires-python = ">=3.9"
dependencies = ["boto3>=1.34", "openpyxl>=3.1"]

[project.scripts]
aid-pipeline = "python_pipeline.cli:main"

[tool.setuptools]
packages = ["python_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
